[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "oauthpy"
dynamic = ["version"]
description = "Local Python access to OAuth-authenticated coding agents"
readme = "README.md"
authors = [
    { name = "Philipp Flotho" }
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typing-extensions>=4.8.0; python_version<'3.12'",
    "claude-agent-sdk>=0.1.65",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
oauthpy = "oauthpy.cli:main"

[project.optional-dependencies]
# Gemini support shells out to the installed `gemini` CLI and currently has no
# additional Python dependency. Keep the extra so users can opt into the surface
# explicitly with `pip install oauthpy[gemini]`.
gemini = []
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
]
docs = [
    "sphinx~=7.4",
    "myst-parser~=4.0",
    "linkify-it-py~=2.0",
    "sphinx-copybutton~=0.5",
    "sphinx-design~=0.6",
    "pydata-sphinx-theme~=0.15",
    "sphinx-autodoc-typehints~=2.3",
]
dev = [
    "build>=1.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff==0.8.6",
    "twine>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/brotherlattice/oauthpy"
Issues = "https://github.com/brotherlattice/oauthpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oauthpy = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/oauthpy/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
addopts = "-vv -s --strict-markers --disable-warnings --timeout=60 --timeout-method=thread --cov=oauthpy --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_codex: requires a local `codex` CLI that is logged in (skipped by default)",
    "live_claude: requires a local Claude auth (claude-agent-sdk / claude CLI) (skipped by default)",
    "live_gemini: requires a local `gemini` CLI that is authenticated (skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["oauthpy"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
